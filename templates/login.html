{% extends "base.html" %}

{% block title %}Sign In — DataProcess Flowrack{% endblock %}

{% block content %}
<div class="row justify-content-center py-4">
    <div class="col-md-6 col-lg-4">
        <div class="card shadow-sm">
            <div class="card-body p-4">

                <div class="text-center mb-4">
                    <img src="{{ url_for('static', filename='logo.png') }}"
                        alt="logo" height="70" class="mb-3">
                    <h4 class="fw-bold">DataProcess Flow</h4>
                    <p class="text-muted small mb-0">by 3Consulting</p>
                    <p class="text-muted small">Sign in to your account</p>
                </div>

                <form method="POST">
                    {{ csrf_token() }}

                    <!-- Email -->
                    <div class="mb-3">
                        <label for="email" class="form-label fw-semibold">Email Address</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light">
                                <i class="fas fa-envelope text-muted"></i>
                            </span>
                            <input type="email" class="form-control" id="email" name="email" required autofocus>
                        </div>
                    </div>

                    <!-- Password with Eye Toggle -->
                    <div class="mb-3">
                        <label for="password" class="form-label fw-semibold">Password</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light">
                                <i class="fas fa-lock text-muted"></i>
                            </span>

                            <input type="password" class="form-control" id="password" name="password" required>

                            <button class="btn btn-outline-secondary" type="button"
                                    onclick="togglePassword()">
                                <i class="fas fa-eye" id="eyeIcon"></i>
                            </button>
                        </div>
                    </div>

                    <div class="d-grid mb-3">
                        <button type="submit" class="btn btn-primary fw-semibold" id="loginBtn">
                            <i class="fas fa-sign-in-alt me-2"></i>Sign In
                        </button>
                    </div>

                </form>

                <!-- Forgot Password -->
                <div class="text-center mb-3">
                    <a href="{{ url_for('forgot_password') }}" class="text-muted small text-decoration-none">
                        <i class="fas fa-key me-1"></i>Forgot your password?
                    </a>
                </div>

                <hr>

                <!-- Register -->
                <div class="text-center">
                    <p class="text-muted small mb-2">Don't have an account?</p>
                    <a href="{{ url_for('register') }}" class="btn btn-outline-primary w-100">
                        <i class="fas fa-rocket me-2"></i>Sign Up
                    </a>
                </div>

                <div class="text-center mt-3">
                    <a href="{{ url_for('index') }}" class="text-muted small text-decoration-none">
                        <i class="fas fa-arrow-left me-1"></i>Back to home
                    </a>
                </div>

            </div>
        </div>
    </div>
</div>

<!-- PASSWORD TOGGLE SCRIPT -->
<script>
function togglePassword() {
    const password = document.getElementById("password");
    const icon = document.getElementById("eyeIcon");

    if (password.type === "password") {
        password.type = "text";
        icon.classList.remove("fa-eye");
        icon.classList.add("fa-eye-slash");
    } else {
        password.type = "password";
        icon.classList.remove("fa-eye-slash");
        icon.classList.add("fa-eye");
    }
}
</script>

{% endblock %}
