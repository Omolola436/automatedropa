{% extends "base.html" %}

{% block title %}MFA Challenge — DataProcess Flow{% endblock %}

{% block content %}
<div class="container py-4">
  <h3>MFA Verification</h3>
  <p>Enter the code from your authenticator app to continue signing in.</p>
  <form method="POST">
    <div class="mb-3">
      <label class="form-label">Code</label>
      <input type="text" name="code" class="form-control" required autofocus>
    </div>
    <button class="btn btn-primary">Verify</button>
  </form>
</div>
{% endblock %}
